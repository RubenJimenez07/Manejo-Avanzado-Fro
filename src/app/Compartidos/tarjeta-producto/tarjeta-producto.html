<p-card [header]="producto().nombre">
  <p>{{ producto().descripcion }}</p>

  <p-tag
    severity="success"
    [rounded]="true"
    [value]="'$' + producto().precio.toLocaleString('es-MX')"
  />

  <ng-template #footer>
    <div class="acciones">
      <a [routerLink]="['/productos', producto().id]" pButton>
        <span pButtonLabel>Ver detalle</span>
      </a>

      <p-button
        [label]="esFavorito() ? '♥ Agregado' : '♡ Agregar a favoritos'"
        [severity]="esFavorito() ? 'danger' : 'secondary'"
        [disabled]="esFavorito()"
        [styleClass]="esFavorito() ? 'favorito-seleccionado' : ''"
        (onClick)="seleccionarFavorito()"
      />
    </div>
  </ng-template>
</p-card>
